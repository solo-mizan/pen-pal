name: 15-Minute Vercel Cron Trigger

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  
  # Allows you to manually trigger it from the GitHub Actions tab for testing
  workflow_dispatch:

jobs:
  trigger-vercel-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel API Endpoint
        env:
          CRON_SECRET: "c1d4f4b7f0a9d49d3ae38e0d3f6d4584d58d3a02ca9b4ee7f0d078e39d3b2c0b"
          VERCEL_URL: "https://letter.asf.run/api/cron/deliver"
        run: |
          echo "Triggering cron endpoint..."
          
          # Send request and capture HTTP status code
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X GET "$VERCEL_URL" \
            -H "Authorization: Bearer $CRON_SECRET")
          
          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Response body:"
          cat response.json

          # Fail the GitHub Action workflow if the endpoint didn't return 200 OK
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Cron execution failed with status $HTTP_STATUS"
            exit 1
          fi